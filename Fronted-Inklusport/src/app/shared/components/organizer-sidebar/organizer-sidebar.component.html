<!-- Botón flotante para volver a mostrar el menú cuando está escondido -->
<button
  type="button"
  class="sidebar-show-btn"
  (click)="toggle()"
  aria-label="Mostrar menú">
  ☰
</button>

<!-- Fondo oscuro (solo en pantallas pequeñas cuando el menú está abierto) -->
<div class="sidebar-backdrop" (click)="toggle()"></div>

<!-- MENÚ LATERAL -->
<aside class="sidebar">
  <div class="sidebar-top">
    <div class="brand-section">
      <div class="brand-title">INKLUSPORT</div>
      <button
        type="button"
        class="sidebar-hide-btn"
        (click)="toggle()"
        aria-label="Esconder menú">
        «
      </button>
    </div>

    <div class="organizer-profile-card">
      <div class="organizer-avatar">
        <img
          src="https://images.unsplash.com/photo-1560250097-0b93528c311a?w=100&auto=format&fit=crop&q=80"
          alt="Organizador"
        />
      </div>
      <div>
        <div class="organizer-name">Elite Organizer</div>
        <div class="organizer-role">Event Operations</div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <button
        *ngFor="let item of navItems"
        type="button"
        class="sidebar-nav-item"
        [class.active]="item.id === activeItem"
        (click)="navigate(item)">
        <span class="nav-icon">{{ item.icon }}</span> {{ item.label }}
      </button>

      <div class="sidebar-divider"></div>

      <button
        *ngFor="let item of secondaryItems"
        type="button"
        class="sidebar-nav-item"
        [class.active]="item.id === activeItem"
        (click)="navigate(item)">
        <span class="nav-icon">{{ item.icon }}</span> {{ item.label }}
      </button>
    </nav>
  </div>

  <button type="button" class="logout-btn" (click)="logout()">
    <span class="nav-icon">↪</span> Cerrar Sesión
  </button>
</aside>
