<header class="top-nav">
  <div class="nav-left">
    <button class="hamburger-btn" (click)="openSidebar()" aria-label="Abrir menú">
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>
    <a routerLink="/home" class="brand-logo">INKLUSPORT</a>
  </div>
  <div class="nav-right">
    <div class="user-info-text">
      <span class="user-role-label">{{ rolActivo | uppercase }} </span>
      <div class="user-name-text">{{ usuarioActivo.nombre }}</div>
    </div>
    <div class="user-avatar-btn" (click)="handleLogout()" title="Cerrar sesión">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E11D48" stroke-width="2">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
    </div>
  </div>
</header>

<div class="sidebar-backdrop" [class.sidebar-backdrop--visible]="sidebarOpen" (click)="closeSidebar()"></div>

<aside class="sidebar-panel" [class.sidebar-panel--open]="sidebarOpen">
  <button class="close-sidebar-btn" (click)="closeSidebar()" title="Cerrar menú" aria-label="Cerrar menú">
    &times;
  </button>

  <div class="sidebar-profile-section">
    <div class="sidebar-avatar-box">
      <svg width="54" height="54" viewBox="0 0 24 24" fill="#0D9488">
        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
      </svg>
    </div>
    <h3 class="sidebar-user-name">{{ usuarioActivo.nombre }}</h3>
    <p class="sidebar-user-role">{{ rolActivo }}</p>
  </div>

  <nav class="sidebar-nav-list">

    <a
      routerLink="/home"
      routerLinkActive="sidebar-nav-item--active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="sidebar-nav-item"
      (click)="closeSidebar()"
    >
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>INICIO</span>
    </a>

    <a
      routerLink="/events"
      routerLinkActive="sidebar-nav-item--active"
      class="sidebar-nav-item"
      (click)="closeSidebar()"
    >
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>EVENTOS</span>
    </a>

    <div class="sidebar-nav-item" (click)="onComingSoon('Calendar')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>CALENDARIO</span>
    </div>

    <a
      routerLink="/events/profile"
      routerLinkActive="sidebar-nav-item--active"
      class="sidebar-nav-item"
      (click)="closeSidebar()"
    >
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>PERFIL</span>
    </a>

    <a
      routerLink="/accessibility"
      routerLinkActive="sidebar-nav-item--active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="sidebar-nav-item"
      (click)="closeSidebar()"
    >
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="4" r="2"/><path d="M12 6v6m0 0v6m-4-8h8"/></svg>
      <span>ACCESIBILIDAD</span>
    </a>

    <div class="sidebar-nav-item" (click)="onComingSoon('AI Assistant')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/></svg>
      <span> ASISTENTE AI </span>
    </div>

  </nav>
</aside>
