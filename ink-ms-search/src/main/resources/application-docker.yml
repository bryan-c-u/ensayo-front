spring:
  application:
    name: ink-ms-search

  data:
    mongodb:
      uri: mongodb://admin:admin123@mongodb:27017/search_db?authSource=admin
      database: search_db
      auto-index-creation: false

  main:
    allow-bean-definition-overriding: true

server:
  port: 3007

jwt:
  secret: inklusport2024superSecretKeyForJWTtokenGenerationWith512bitsAlgorithmHS512
  expiration: 86400000

auth:
  service:
    url: http://auth-service:3001

users:
  service:
    url: http://users-service:3003

sports:
  service:
    url: http://sports-service:3003

feign:
  circuitbreaker:
    enabled: true

search:
  sync:
    interval-ms: 300000

security:
  basic:
    enabled: false

logging:
  level:
    com.inklusport.search: DEBUG
