spring:
  application:
    name: ink-ms-gateway

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
              - "http://localhost:4300"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        # 1. Auth MS (unico microservicio activo por ahora, junto con este gateway)
        - id: auth-ms
          uri: http://localhost:3001
          predicates:
            - Path=/api/auth/**

        # Rutas comentadas: sus microservicios no estan corriendo en este entorno reducido.
        # Descomentar cada bloque cuando el MS correspondiente vuelva a estar disponible.

        # 2. Users MS
        - id: users-ms
          uri: http://localhost:3003
          predicates:
             - Path=/api/users/**

        # 2.0 Admin MS (Modulo de Administracion, M08) - remapeado a 3009 por choque con suscripciones
        - id: admin-ms
          uri: http://localhost:3009
          predicates:
            - Path=/api/admin/**

        # 2.1 Suscripciones MS (Modulo de Suscripciones y Monetizacion, M09)
        - id: suscripciones-ms
          uri: http://localhost:3005
          predicates:
            - Path=/api/planes/**, /api/suscripciones/**, /api/eventos-pago/**, /api/pagos/**, /api/reportes/**

        # 2.2 Search MS (Modulo de Filtros y Busquedas Administrativas, M07)
        - id: search-ms
          uri: http://localhost:3007
          predicates:
            - Path=/api/search/**

        # 3. Sports MS (remapeado a 3008 por choque con users)
        - id: sports-ms
          uri: http://localhost:3008
          predicates:
            - Path=/api/sports/**, /api/events/**, /api/disabilities/**, /api/sport-disabilities/**, /api/registrations/**, /api/waitlist/**, /api/calendar/**, /api/scheduler/**, /api/attendance/**

        # # 4. Accessibility MS (deshabilitado: requiere MongoDB, no instalado)
        # - id: accessibility-ms
        #   uri: http://localhost:3004
        #   predicates:
        #     - Path=/api/preferences/**, /api/notifications/**

        # 5. Reports MS
        - id: reports-ms
          uri: http://localhost:3006
          predicates:
            - Path=/api/analytics/**, /api/dashboard/**, /api/reports/**

server:
  port: 8080

logging:
  level:
    org.springframework.cloud.gateway: DEBUG