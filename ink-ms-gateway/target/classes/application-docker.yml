spring:
  application:
    name: ink-ms-gateway
  
  cloud:
    gateway:
      routes:
        # 1. Auth Service (unico microservicio activo por ahora, junto con este gateway)
        - id: auth-ms
          uri: http://auth-service:3001
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=0

        # Rutas comentadas: sus microservicios no estan corriendo en este entorno reducido.
        # Descomentar cada bloque cuando el MS correspondiente vuelva a estar disponible.

