# Este archivo es un template/ejemplo de cómo configurar la aplicación.
# NUNCA commits credenciales reales. Usa variables de entorno o archivos .env.

spring:
  application:
    name: ink-ms-users
  
  datasource:
    url: jdbc:mysql://localhost:3306/user_ms?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format-sql: true
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 3002
  servlet:
    context-path: /api

jwt:
  secret: ${JWT_SECRET:cambiar-esta-clave-en-produccion}
  expiration: 86400000

auth:
  service:
    url: ${AUTH_SERVICE_URL:http://localhost:3001}

feign:
  circuitbreaker:
    enabled: true

mail:
  host: ${MAIL_HOST:smtp.gmail.com}
  port: ${MAIL_PORT:465}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  protocol: smtps
  properties:
    mail:
      smtp:
        auth: true
        ssl:
          enable: true
        starttls:
          enable: false
        socketFactory:
          port: 465
          class: javax.net.ssl.SSLSocketFactory

logging:
  level:
    com.inklusport.users: DEBUG
